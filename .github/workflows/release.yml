name: Package and release

# Push a version tag (e.g. v0.5.0) to build the addon zip and upload it to
# CurseForge and GitHub Releases. Tags containing "alpha" or "beta" are
# uploaded as alpha/beta files.
on:
  push:
    tags:
      - "*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The packager builds the changelog from git history.
          fetch-depth: 0

      - uses: BigWigsMods/packager@v2
